<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    {% include '_pwa_meta.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المراسلات الخاصة - مجتمع بونص فارما</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ===== DESIGN TOKENS ===== */
        :root {
            --primary: hsl(222, 82%, 43%);
            --primary-dark: hsl(222, 86%, 33%);
            --primary-light: hsl(222, 82%, 55%);
            --accent: hsl(175, 68%, 42%);
            --sent-bg: linear-gradient(135deg, hsl(222, 75%, 52%) 0%, hsl(175, 68%, 38%) 100%);
            --received-bg: #ffffff;
            --chat-bg: hsl(220, 22%, 96%);
            --panel-bg: rgba(255,255,255,0.97);
            --border: hsla(220, 14%, 85%, 0.7);
            --text-primary: hsl(220, 20%, 16%);
            --text-secondary: hsl(220, 12%, 50%);
            --text-muted: hsl(220, 10%, 65%);
            --shadow-sm: 0 2px 8px hsla(222,50%,20%,0.08);
            --shadow-md: 0 8px 24px hsla(222,50%,20%,0.12);
            --shadow-lg: 0 20px 50px hsla(222,50%,20%,0.2);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
        }

        /* ===== RESET & BASE ===== */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, hsl(222,82%,14%) 0%, hsl(175,68%,16%) 100%);
            min-height: 100vh;
            direction: rtl;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: hsla(222,30%,60%,0.35); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: hsla(222,30%,50%,0.55); }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            margin: 24px auto;
            max-width: 1000px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        /* ===== PAGE HEADER ===== */
        .header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, hsl(175,68%,28%) 100%);
            color: white;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .header h1 {
            margin: 0;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: 0.01em;
        }

        .header p {
            margin: 3px 0 0;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.7);
        }

        /* ===== CONTENT AREA ===== */
        .content-area { padding: 24px; }

        /* ===== MESSAGES CONTAINER ===== */
        .messages-container {
            display: flex;
            gap: 20px;
            height: 68vh;
            min-height: 420px;
        }

        /* ===== CONVERSATIONS LIST ===== */
        .conversations-list {
            flex: 1;
            background: hsl(220,22%,98%);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm), 0 0 0 1px var(--border);
            overflow: hidden;
        }

        .conversations-list-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border);
            background: #fff;
        }

        .new-message-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 14px hsla(222,60%,40%,0.3);
        }

        .new-message-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px hsla(222,60%,40%,0.4);
        }

        .conversations-list-scroll {
            flex: 1;
            overflow-y: auto;
        }

        /* ===== CONVERSATION ITEM ===== */
        .conversation-item {
            padding: 13px 16px;
            border-bottom: 1px solid hsla(220,14%,92%,0.7);
            cursor: pointer;
            transition: background var(--transition);
            border-radius: 0;
        }

        .conversation-item:hover { background: hsla(222,82%,55%,0.05); }

        .conversation-item.active {
            background: linear-gradient(90deg, hsla(222,82%,55%,0.12) 0%, transparent 100%);
            border-right: 3px solid var(--primary);
        }

        .conversation-item.unread {
            background: hsla(45,90%,96%,0.8);
            border-right: 3px solid hsl(45,90%,55%);
        }

        .company-name {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .last-message {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item.active .last-message { color: rgba(0,0,0,0.55); }

        .message-time {
            font-size: 0.72rem;
            color: var(--text-muted);
            float: left;
        }

        .conversation-item.active .message-time { color: var(--text-secondary); }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 2;
            background: var(--panel-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm), 0 0 0 1px var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== CHAT HEADER ===== */
        .chat-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, hsl(175,68%,28%) 100%);
            padding: 14px 18px;
            border-bottom: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header h5 {
            margin: 0;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header h5 i { opacity: 0.8; }

        /* ===== CHAT MESSAGES ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px;
            background:
                radial-gradient(ellipse at top right, hsla(222,60%,96%,0.6) 0%, transparent 60%),
                radial-gradient(ellipse at bottom left, hsla(175,60%,96%,0.5) 0%, transparent 60%),
                hsl(220,22%,96%);
        }

        /* ===== MESSAGE BUBBLE ===== */
        .message {
            margin-bottom: 8px;
            padding: 0;
            border-radius: 0;
            max-width: 70%;
            word-wrap: break-word;
            animation: msgIn 0.2s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.sent { margin-right: auto; margin-left: 30%; }
        .message.received { margin-left: auto; margin-right: 30%; }

        .message > div:first-child {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .message.sent > div:first-child {
            background: var(--sent-bg);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 3px 10px hsla(222,60%,30%,0.25);
        }

        .message.received > div:first-child {
            background: var(--received-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px hsla(220,20%,30%,0.1);
            border: 1px solid hsla(220,14%,92%,0.8);
        }

        .message-info {
            font-size: 0.72rem;
            margin-top: 4px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .message.sent .message-info { text-align: right; }
        .message.received .message-info { text-align: left; }

        /* Image in message */
        .message > div:first-child img {
            max-width: 220px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: block;
            transition: transform var(--transition);
        }

        .message > div:first-child img:hover { transform: scale(1.02); }

        /* ===== EMPTY CHAT ===== */
        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 32px;
        }

        .empty-chat-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, hsla(222,82%,55%,0.1) 0%, hsla(175,68%,42%,0.1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .empty-chat-icon i { font-size: 2rem; color: var(--primary-light); opacity: 0.6; }
        .empty-chat h4 { font-size: 1rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
        .empty-chat p { font-size: 0.85rem; color: var(--text-muted); }

        /* ===== CHAT INPUT ===== */
        .chat-input {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            padding: 12px 16px 14px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
        }

        .message-input {
            flex: 1;
            resize: none;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            color: var(--text-primary);
            background: hsl(220,20%,97%);
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
        }

        .message-input:focus {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 3px hsla(222,82%,55%,0.12);
            outline: none;
        }

        .message-input::placeholder { color: var(--text-muted); }

        .attach-admin-btn {
            background: hsl(220,20%,95%);
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 1rem;
            flex-shrink: 0;
        }

        .attach-admin-btn:hover {
            background: hsla(222,82%,55%,0.1);
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 14px hsla(222,60%,40%,0.3);
            white-space: nowrap;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px hsla(222,60%,40%,0.4);
        }

        .send-btn:active { transform: scale(0.97); }
        .send-btn:disabled { opacity: 0.6; transform: none; }

        /* ===== MODAL ===== */
        .modal-content {
            border: none;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, hsl(175,68%,28%) 100%);
            color: white;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            border-bottom: none;
            padding: 16px 20px;
        }

        .modal-header .modal-title { font-weight: 700; font-size: 1rem; color: #fff; }
        .modal-header .btn-close { filter: brightness(0) invert(1); opacity: 0.8; }
        .modal-header .btn-close:hover { opacity: 1; }
        .modal-body { padding: 22px; }

        .modal-body .form-label {
            font-weight: 600;
            font-size: 0.87rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .modal-body .form-control,
        .modal-body .form-select {
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            padding: 10px 14px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .modal-body .form-control:focus,
        .modal-body .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px hsla(222,82%,55%,0.12);
        }

        .modal-footer {
            border-top: 1px solid var(--border);
            padding: 14px 20px;
        }

        .modal-footer .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 14px hsla(222,60%,40%,0.3);
            transition: all var(--transition);
        }

        .modal-footer .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px hsla(222,60%,40%,0.4);
        }

        .modal-footer .btn-secondary {
            font-family: 'Cairo', sans-serif;
            border-radius: var(--radius-sm);
            padding: 10px 18px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .main-container { margin: 0; border-radius: 0; min-height: 100vh; }
            .content-area { padding: 14px; }
            .messages-container {
                flex-direction: column;
                height: auto;
                min-height: 0;
            }
            .conversations-list { height: 260px; flex: none; }
            .chat-area { flex: none; height: 400px; }
        }
    </style>
    <link href="{{ url_for('static', filename='css/admin_identity.css') }}" rel="stylesheet">
</head>
<body>
    {% include '_admin_navbar.html' %}

    <div class="main-container">
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-envelope"></i>
            </div>
            <div>
                <h1>المراسلات الخاصة</h1>
                <p>تواصل مع أعضاء مجتمع بونص فارما</p>
            </div>
        </div>

        <div class="content-area">
            <div class="messages-container">
                <!-- قائمة المحادثات -->
                <div class="conversations-list">
                    <div class="conversations-list-header">
                        <button class="new-message-btn" onclick="showNewMessageModal()">
                            <i class="fas fa-plus"></i> رسالة جديدة
                        </button>
                    </div>
                    <div class="conversations-list-scroll">
                        <div id="conversationsList">
                            <!-- المحادثات ستظهر هنا -->
                        </div>
                    </div>
                </div>

                <!-- منطقة الدردشة -->
                <div class="chat-area">
                    <div id="chatContent">
                        <div class="empty-chat" style="height: 100%;">
                            <div class="empty-chat-icon">
                                <i class="fas fa-comments"></i>
                            </div>
                            <h4>اختر محادثة للبدء</h4>
                            <p>اختر محادثة من القائمة أو ابدأ رسالة جديدة</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Message Modal -->
    <div class="modal fade" id="newMessageModal" tabindex="-1" aria-labelledby="newMessageModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newMessageModalLabel">رسالة جديدة</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="newMessageForm">
                        <div class="mb-3">
                            <label for="recipientSelect" class="form-label">المستقبل</label>
                            <select class="form-select" id="recipientSelect" required>
                                <option value="">اختر الشركة...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="messageSubject" class="form-label">الموضوع</label>
                            <input type="text" class="form-control" id="messageSubject" required>
                        </div>
                        <div class="mb-3">
                            <label for="messageContent" class="form-label">الرسالة</label>
                            <textarea class="form-control" id="messageContent" rows="4" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="sendNewMessage()">
                        <i class="fas fa-paper-plane me-1"></i> إرسال
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let conversations = [];
        let messages = [];
        let currentConversation = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
            loadCompanies();
            
            // التحقق من وجود معرف شركة في URL للمراسلة المباشرة
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('company_id');
            const companyName = urlParams.get('company_name');
            
            if (companyId && companyName) {
                openDirectConversation(companyId, companyName);
            }
        });

        function loadConversations() {
            fetch('/messages/conversations')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        conversations = data.conversations;
                        displayConversations();
                    }
                })
                .catch(error => console.error('Error loading conversations:', error));
        }

        function loadCompanies() {
            fetch('/community_bonus/get_companies')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const select = document.getElementById('recipientSelect');
                        data.companies.forEach(company => {
                            const option = document.createElement('option');
                            option.value = company.id;
                            option.textContent = company.company_name;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(error => console.error('Error loading companies:', error));
        }

        function displayConversations() {
            const container = document.getElementById('conversationsList');
            container.innerHTML = '';

            if (conversations.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted);font-size:0.85rem;">لا توجد محادثات بعد</div>';
                return;
            }

            conversations.forEach(conv => {
                const companyId = Number(conv.other_company_id) || 0;
                const companyName = conv.other_company_name || '';
                const lastMessage = conv.last_message || '';
                const item = document.createElement('div');
                item.className = `conversation-item ${!conv.is_read ? 'unread' : ''}`;
                item.onclick = () => openConversation(companyId, companyName);
                
                item.innerHTML = `
                    <div class="company-name">${escapeHtml(companyName)}</div>
                    <div class="last-message">${escapeHtml(lastMessage)}</div>
                    <div class="message-time">${escapeHtml(formatDate(conv.last_message_time))}</div>
                `;
                
                container.appendChild(item);
            });
        }

        function openConversation(companyId, companyName) {
            currentConversation = companyId;
            
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.conversation-item').classList.add('active');
            
            loadMessages(companyId, companyName);
        }

        function openDirectConversation(companyId, companyName) {
            const existingConv = conversations.find(c => c.other_company_id == companyId);
            if (existingConv) {
                openConversation(companyId, companyName);
            } else {
                currentConversation = companyId;
                loadMessages(companyId, companyName);
            }
        }

        function loadMessages(companyId, companyName) {
            fetch(`/messages/conversation/${companyId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        messages = data.messages;
                        displayChat(companyId, companyName);
                    }
                })
                .catch(error => console.error('Error loading messages:', error));
        }

        function formatMessageContent(text) {
            if (!text) return '';
            const imgMatch = text.match(/^\[IMAGE\](.*?)\[\/IMAGE\]$/);
            if (imgMatch) {
                return `<div style="background: transparent; border: none;"><img src="${imgMatch[1]}" style="max-width: 220px; border-radius: 12px; cursor: pointer;" onclick="window.open(this.src, '_blank')" alt="صورة مرسلة"></div>`;
            }
            return escapeHtml(text);
        }

        function displayChat(companyId, companyName) {
            const chatContent = document.getElementById('chatContent');
            
            chatContent.innerHTML = `
                <div class="chat-header">
                    <i class="fas fa-user" style="color:rgba(255,255,255,0.75);font-size:0.95rem;"></i>
                    <h5>${escapeHtml(companyName)}</h5>
                </div>
                <div class="chat-messages" id="chatMessages">
                    ${messages.map(msg => `
                        <div class="message ${msg.is_sent ? 'sent' : 'received'}">
                            <div>${formatMessageContent(msg.message)}</div>
                            <div class="message-info">${escapeHtml(formatDate(msg.sent_at))}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="chat-input">
                    <button class="attach-admin-btn" type="button" title="إرفاق صورة" onclick="document.getElementById('imageInput').click()">
                        <i class="fas fa-camera"></i>
                    </button>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="uploadMessageImage(event)">
                    <textarea class="message-input" id="messageInput" placeholder="اكتب رسالتك هنا..." rows="2"></textarea>
                    <button class="send-btn ms-2" id="sendBtn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i> إرسال
                    </button>
                </div>
            `;
            
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentConversation) return;
            
            fetch('/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    receiver_id: currentConversation,
                    subject: 'رسالة من المجتمع',
                    message: message
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    input.value = '';
                    loadMessages(currentConversation, getCurrentConversationName());
                    loadConversations();
                } else {
                    alert('حدث خطأ في إرسال الرسالة');
                }
            })
            .catch(error => {
                console.error('Error sending message:', error);
                alert('حدث خطأ في الاتصال');
            });
        }

        async function uploadMessageImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!currentConversation) {
                alert('الرجاء اختيار المحادثة الفعالة أولاً');
                event.target.value = '';
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            const sendBtn = document.getElementById('sendBtn');
            const originalHTML = sendBtn.innerHTML;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/messages/upload-image', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data && data.success) {
                    const downloadURL = data.url;
                    document.getElementById('messageInput').value = `[IMAGE]${downloadURL}[/IMAGE]`;
                    sendMessage();
                } else {
                    throw new Error(data.message || 'فشل الرفع');
                }
            } catch (error) {
                console.error('Image Upload Error:', error);
                alert('فشل في رفع الصورة، يرجى المحاولة لاحقاً');
            } finally {
                sendBtn.innerHTML = originalHTML;
                sendBtn.disabled = false;
                event.target.value = '';
            }
        }

        function showNewMessageModal() {
            const modal = new bootstrap.Modal(document.getElementById('newMessageModal'));
            modal.show();
        }

        function sendNewMessage() {
            const recipientId = document.getElementById('recipientSelect').value;
            const subject = document.getElementById('messageSubject').value;
            const message = document.getElementById('messageContent').value;
            
            if (!recipientId || !subject || !message) {
                alert('يرجى ملء جميع الحقول');
                return;
            }
            
            fetch('/messages/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    receiver_id: recipientId,
                    subject: subject,
                    message: message
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('newMessageModal')).hide();
                    document.getElementById('newMessageForm').reset();
                    loadConversations();
                    alert('تم إرسال الرسالة بنجاح');
                } else {
                    alert('حدث خطأ في إرسال الرسالة');
                }
            })
            .catch(error => {
                console.error('Error sending message:', error);
                alert('حدث خطأ في الاتصال');
            });
        }

        function getCurrentConversationName() {
            const activeItem = document.querySelector('.conversation-item.active');
            return activeItem ? activeItem.querySelector('.company-name').textContent : '';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ar-EG', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.id === 'messageInput' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
