<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    {% include \'_pwa_meta.html\' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مجتمع ستوك فلو - ستوك فلو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1243C4 0%, #0A2DA0 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --border-radius: 16px;
            --mobile-padding: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            background-attachment: fixed;
        }

        /* Mobile-First Container - ثابتة بارتفاع الشاشة والتمرير داخل المنشورات فقط */
        .mobile-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* منع سكرول عام، سكرول داخل منطقة المنشورات فقط */
        }

        /* Mobile Header */
        .mobile-header {
            background: var(--primary-gradient);
            color: white;
            padding: 16px var(--mobile-padding);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-title {
            flex: 1;
            text-align: center;
        }

        .header-title h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Mobile Navigation Tabs */
        .mobile-tabs {
            display: flex;
            background: white;
            border-radius: var(--border-radius);
            margin: 12px var(--mobile-padding);
            padding: 4px;
            box-shadow: var(--card-shadow);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: sticky;
            top: 70px; /* يظهر تحت الـ header مباشرة */
            z-index: 999;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6c757d;
            transition: var(--transition);
            white-space: nowrap;
            min-width: 80px;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(18, 67, 196, 0.3);
        }

        /* ===== FAB (Floating Action Button) ===== */
        .fab-create-post {
            position: fixed;
            bottom: 40px;
            left: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(18, 67, 196, 0.45);
            z-index: 1001;
            cursor: pointer;
            transition: var(--transition);
            animation: fab-pulse 2s infinite;
        }
        .fab-create-post:hover { transform: scale(1.08); }
        .fab-create-post:active { transform: scale(0.92); }
        @keyframes fab-pulse {
            0%,100% { box-shadow: 0 6px 20px rgba(18,67,196,0.45); }
            50%     { box-shadow: 0 6px 30px rgba(18,67,196,0.65); }
        }

        /* ===== Create-Post Modal Overlay ===== */
        .create-post-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: overlay-in .25s ease;
        }
        .create-post-overlay.active { display: flex; }
        @keyframes overlay-in { from{opacity:0} to{opacity:1} }

        .create-post-modal {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 20px 20px 0 0;
            padding: 0;
            overflow-y: auto;
            animation: modal-slide-up .3s cubic-bezier(.4,0,.2,1);
            box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
        }
        @keyframes modal-slide-up { from{transform:translateY(100%)} to{transform:translateY(0)} }

        .modal-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid #f1f3f4;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
            border-radius: 20px 20px 0 0;
        }
        .modal-header-bar h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .modal-close-btn {
            background: #f1f3f4;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #6c757d;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close-btn:hover { background: #e9ecef; color: #dc3545; }

        .modal-body {
            padding: 16px 20px 20px;
        }

        /* Textarea inside modal */
        .post-input-wrapper {
            position: relative;
            margin-bottom: 12px;
        }
        .post-textarea {
            width: 100%;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            resize: none;
            transition: var(--transition);
            font-family: inherit;
            min-height: 100px;
        }
        .post-textarea:focus {
            outline: none;
            border-color: #1243C4;
            box-shadow: 0 0 0 3px rgba(18, 67, 196, 0.1);
        }
        .char-counter {
            position: absolute;
            bottom: 8px;
            left: 12px;
            font-size: 0.7rem;
            color: #6c757d;
            background: rgba(255,255,255,0.9);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Media buttons row inside modal */
        .media-upload-section { margin-bottom: 12px; }
        .media-upload-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        .media-btn {
            background: #f0f4ff;
            border: 2px solid #dce3f5;
            color: #1243C4;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
            cursor: pointer;
        }
        .media-btn:hover { background: #dce3f5; border-color: #1243C4; }
        .media-btn:active { transform: scale(0.93); }
        .media-btn span {
            font-size: 0.65rem;
            display: block;
            margin-top: 2px;
        }

        /* Preview grid */
        .media-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .media-preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
        }
        .media-preview-item img,
        .media-preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-preview-item .audio-preview {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-gradient);
            color: white;
            font-size: 2rem;
        }
        .media-preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(220,53,69,0.9);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .media-preview-remove:hover { background: #dc3545; transform: scale(1.1); }

        /* Bottom actions bar inside modal */
        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-top: 1px solid #f1f3f4;
            background: #fafbfc;
        }
        .anonymous-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #6c757d;
            cursor: pointer;
        }
        .toggle-switch {
            position: relative;
            width: 40px;
            height: 20px;
            background: #ccc;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
        }
        .toggle-switch.active { background: #1243C4; }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: var(--transition);
        }
        .toggle-switch.active::after { left: 22px; }

        .submit-btn {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 22px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .submit-btn:active { transform: scale(0.95); }

        /* Mobile Posts Container - هي المنطقة الوحيدة القابلة للتمرير */
        .posts-container-mobile {
            flex: 1;
            padding: 80px var(--mobile-padding) 20px;
            margin-top: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Mobile Post Card */
        .post-card-mobile {
            background: white;
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        #posts-list .post-card-mobile:first-child {
            margin-top: 4px;
        }

        .post-card-mobile:active {
            transform: scale(0.98);
        }

        .post-header-mobile {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .avatar-mobile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .post-meta-mobile {
            flex: 1;
            min-width: 0;
        }

        .company-name-mobile {
            font-weight: 600;
            font-size: 0.95rem;
            color: #2c3e50;
            margin: 0;
            line-height: 1.2;
            word-wrap: break-word;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .company-name-link {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .company-name-link:hover {
            color: #1243C4;
            text-decoration: underline;
        }

        .verification-badge {
            color: #1da1f2;
            font-size: 0.85rem;
            margin-left: 2px;
        }

        .post-time-mobile {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 2px;
        }

        .post-menu-btn {
            background: none;
            border: none;
            color: #6c757d;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .post-menu-btn:active,
        .post-menu-btn.active {
            background: #f8f9fa;
            color: #495057;
        }

        .post-content-mobile {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #495057;
            margin-bottom: 12px;
            word-wrap: break-word;
        }

        .post-content-mobile a {
            color: #1243C4;
            text-decoration: none;
            font-weight: 500;
        }

        .post-content-mobile a:hover {
            text-decoration: underline;
        }

        .post-media-mobile {
            margin: 0 0 12px;
            overflow: hidden;
            border-radius: 12px;
            background: #0f172a;
        }

        .post-media-mobile video,
        .post-media-mobile img,
        .post-audio-mobile audio {
            display: block;
            width: 100%;
            max-height: 420px;
        }

        .post-media-mobile img {
            object-fit: contain;
            background: #f8fafc;
        }

        .post-audio-mobile {
            margin: 0 0 12px;
            padding: 10px;
            border-radius: 12px;
            background: #f1f5f9;
        }

        /* Mobile Post Actions */
        .post-actions-mobile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f1f3f4;
        }

        .action-group {
            display: flex;
            gap: 8px;
        }

        .action-btn-mobile {
            background: none;
            border: none;
            color: #6c757d;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
            min-width: 60px;
            justify-content: center;
        }

        .action-btn-mobile:active {
            background: #f8f9fa;
            transform: scale(0.95);
        }

        .action-btn-mobile.liked {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        .action-btn-mobile.message-btn {
            color: #27ae60;
            background: rgba(39, 174, 96, 0.1);
        }

        /* Mobile Comments Section */
        .comments-section-mobile {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f1f3f4;
            display: none;
        }

        .comments-section-mobile.show {
            display: block;
        }

        /* معاينة أحدث تعليق أسفل البوست في الصفحة الرئيسية */
        .latest-comment-preview {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f1f3f4;
            cursor: pointer;
        }

        .latest-comment-preview .comment-item-mobile {
            margin-bottom: 0;
        }

        .view-all-comments {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1243C4;
            margin-bottom: 8px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .view-all-comments:active {
            opacity: 0.7;
        }

        .post-clickable {
            cursor: pointer;
        }

        .comment-item-mobile {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .comment-header-mobile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .comment-delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.7;
        }

        .comment-delete-btn:hover {
            background: rgba(220, 53, 69, 0.1);
            opacity: 1;
        }

        .comment-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .comment-edit-btn {
            background: none;
            border: none;
            color: #1243C4;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.7;
        }

        .comment-edit-btn:hover {
            background: rgba(18, 67, 196, 0.1);
            opacity: 1;
        }

        /* Post Edit Form */
        .post-edit-form {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            border: 2px solid #e9ecef;
        }

        .post-edit-textarea {
            width: 100%;
            min-height: 100px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            transition: var(--transition);
            margin-bottom: 12px;
        }

        .post-edit-textarea:focus {
            outline: none;
            border-color: #1243C4;
        }

        .post-edit-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .post-edit-save,
        .post-edit-cancel {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-edit-save {
            background: var(--primary-gradient);
            color: white;
        }

        .post-edit-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(18, 67, 196, 0.3);
        }

        .post-edit-cancel {
            background: #6c757d;
            color: white;
        }

        .post-edit-cancel:hover {
            background: #5a6268;
        }

        /* Comment Edit Form */
        .comment-edit-form {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #e9ecef;
        }

        .comment-edit-input {
            width: 100%;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-family: inherit;
            transition: var(--transition);
            margin-bottom: 8px;
        }

        .comment-edit-input:focus {
            outline: none;
            border-color: #1243C4;
        }

        .comment-edit-actions {
            display: flex;
                gap: 6px;
            justify-content: flex-end;
        }

        .comment-edit-save,
        .comment-edit-cancel {
            padding: 6px 10px;
            border: none;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .comment-edit-save {
            background: #1243C4;
            color: white;
        }

        .comment-edit-save:hover {
            background: #5a6fd8;
        }

        .comment-edit-cancel {
            background: #6c757d;
            color: white;
        }

        .comment-edit-cancel:hover {
            background: #5a6268;
        }

        .comment-author-mobile {
            font-weight: 500;
            font-size: 0.85rem;
            color: #2c3e50;
        }

        .comment-time-mobile {
            font-size: 0.7rem;
            color: #6c757d;
        }

        .comment-content-mobile {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #495057;
        }

        .comment-input-mobile {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .comment-input-field {
            flex: 1;
            border: 2px solid #e9ecef;
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-family: inherit;
            transition: var(--transition);
        }

        .comment-input-field:focus {
            outline: none;
            border-color: #1243C4;
        }

        .comment-submit-btn {
            background: var(--primary-gradient);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .comment-submit-btn:active {
            transform: scale(0.9);
        }

        /* Loading States */
        .loading-mobile {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1243C4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state-mobile {
                text-align: center;
            padding: 40px 20px;
            color: #dc3545;
        }

        .error-state-mobile i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .retry-btn {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 16px;
            transition: var(--transition);
        }

        .retry-btn:active {
            transform: scale(0.95);
        }

        /* Empty State */
        .empty-state-mobile {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-mobile i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state-mobile h3 {
            font-size: 1.1rem;
                margin-bottom: 8px;
            color: #495057;
        }

        .empty-state-mobile p {
            font-size: 0.9rem;
            margin: 0;
        }

        /* Mobile Menu Dropdown */
        .post-menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            padding: 8px 0;
            min-width: 180px;
            z-index: 1000;
            display: none;
            animation: slideDown 0.2s ease-out;
            margin-top: 4px;
            border: 1px solid #e9ecef;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-menu-dropdown.show {
            display: block;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
                font-size: 0.9rem;
            color: #495057;
            transition: var(--transition);
            cursor: pointer;
        }

        .menu-item:active {
            background: #f8f9fa;
        }

        .menu-item i {
            width: 16px;
            text-align: center;
        }

        .menu-item.danger {
            color: #dc3545;
        }

        /* Mobile Bottom Navigation */
        .bottom-nav-mobile {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
            transform: translateZ(0); /* Force hardware acceleration for better performance */
            will-change: transform; /* Optimize for animations */
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border: none;
            background: none;
            color: #6c757d;
            font-size: 0.7rem;
            transition: var(--transition);
            min-width: 60px;
        }

        .bottom-nav-item.active {
            color: #1243C4;
        }

        .bottom-nav-item i {
            font-size: 1.2rem;
        }

        /* Responsive Design */
        @media (max-width: 320px) {
            :root {
                --mobile-padding: 8px;
            }

            .tab-btn {
                font-size: 0.75rem;
                padding: 10px 6px;
            }

            .company-name-mobile {
                font-size: 0.85rem;
            }

            .action-btn-mobile {
                font-size: 0.75rem;
                padding: 6px 8px;
            }
        }

        @media (min-width: 768px) {
            .mobile-container {
                max-width: 768px;
                margin: 20px auto;
                border-radius: 20px;
                min-height: calc(100vh - 40px);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            }

            .mobile-header {
                border-radius: 20px 20px 0 0;
            }

            .bottom-nav-mobile {
                border-radius: 0 0 20px 20px;
            }
        }

        /* Touch-friendly improvements */
        @media (hover: none) and (pointer: coarse) {
            .action-btn-mobile,
            .submit-btn,
            .comment-submit-btn,
            .retry-btn {
                min-height: 44px;
                min-width: 44px;
            }

            .post-menu-btn,
            .header-btn {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* Safe area for modern phones */
        @supports (padding: max(0px)) {
            .mobile-header {
                padding-top: max(16px, env(safe-area-inset-top));
            }

            .posts-container-mobile {
                padding-top: calc(80px + env(safe-area-inset-top));
                padding-bottom: max(20px, calc(20px + env(safe-area-inset-bottom)));
            }

            .fab-create-post {
                bottom: calc(40px + env(safe-area-inset-bottom));
            }
        }

        /* Smooth scrolling للصفحة، لكن التمرير الفعلي داخل posts-container-mobile */
        html {
            scroll-behavior: smooth;
        }

        /* الجسم نفسه بدون سكرول، التمرير داخل الحاوية الداخلية */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* منع سكرول عام */
            min-height: 100vh;
        }

        /* على الموبايل نفس السلوك: بدون padding إضافي للجسم */
        @media (max-width: 768px) {
            body {
                overflow: hidden;
                padding: 0;
            }
        }
    
        /* --- Mobile Responsiveness Bounds Fix --- */
        html, body {
            overflow-x: hidden !important;
            width: 100vw !important;
            max-width: 100vw !important;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch !important;
            overscroll-behavior-x: none !important;
        }

    </style>
</head>
<body data-user-id="{{ current_user.id|default(0) }}">
    <div class="mobile-container">
        <!-- Mobile Header -->
        <div class="mobile-header">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let currentTab = 'all';
        let isAnonymous = false;
        let posts = [];
        let isLoading = false;
        
        // Media upload variables
        let uploadedImages = [];
        let uploadedVideo = null;
        let uploadedAudio = null;

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadPosts();
            setupEventListeners();
            setupCharacterCounter();
        });

        // Setup event listeners
        function setupEventListeners() {
            // Post content textarea
            const postContent = document.getElementById('post-content');
            if (postContent) {
                postContent.addEventListener('input', function() {
                    updateCharacterCounter();
                });

                postContent.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && e.ctrlKey) {
                        e.preventDefault();
                        createPost();
                    }
                });
            }

            // Pull to refresh for mobile
            let touchStartY = 0;
            let touchEndY = 0;

            document.addEventListener('touchstart', function(e) {
                touchStartY = e.changedTouches[0].screenY;
            });

            document.addEventListener('touchend', function(e) {
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            });

            function handleSwipe() {
                if (touchEndY - touchStartY > 100 && window.scrollY === 0) {
                    refreshPosts();
                }
            }
        }

        // Setup character counter
        function setupCharacterCounter() {
            const textarea = document.getElementById('post-content');
            const counter = document.getElementById('char-count');

            if (textarea && counter) {
                textarea.addEventListener('input', updateCharacterCounter);
                updateCharacterCounter();
            }
        }

        function updateCharacterCounter() {
            const textarea = document.getElementById('post-content');
            const counter = document.getElementById('char-count');

            if (textarea && counter) {
                const length = textarea.value.length;
                counter.textContent = length;

                if (length > 450) {
                    counter.style.color = '#dc3545';
                } else if (length > 400) {
                    counter.style.color = '#ffc107';
                } else {
                    counter.style.color = '#6c757d';
                }
            }
        }

        // Toggle anonymous posting
        function toggleAnonymous() {
            isAnonymous = !isAnonymous;
            const toggle = document.getElementById('anonymous-toggle');
            if (toggle) {
                toggle.classList.toggle('active', isAnonymous);
            }
        }

        // Handle image upload
        function handleImageUpload(event) {
            const files = Array.from(event.target.files);
            
            if (files.length === 0) return;
            
            // Check if video or audio already uploaded
            if (uploadedVideo || uploadedAudio) {
                showToast('لا يمكن إضافة صور مع فيديو أو صوت', 'warning');
                event.target.value = '';
                return;
            }
            
            // Limit to 10 images total
            if (uploadedImages.length + files.length > 10) {
                showToast('الحد الأقصى 10 صور', 'warning');
                event.target.value = '';
                return;
            }
            
            files.forEach(file => {
                if (file.size > 10 * 1024 * 1024) { // 10MB limit
                    showToast('حجم الصورة كبير جداً (الحد الأقصى 10MB)', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages.push({
                        file: file,
                        preview: e.target.result,
                        type: 'image'
                    });
                    updateMediaPreview();
                };
                reader.readAsDataURL(file);
            });
            
            event.target.value = '';
        }

        // Handle video upload
        function handleVideoUpload(event) {
            const file = event.target.files[0];
            
            if (!file) return;
            
            // Check if images or audio already uploaded
            if (uploadedImages.length > 0 || uploadedAudio) {
                showToast('لا يمكن إضافة فيديو مع صور أو صوت', 'warning');
                event.target.value = '';
                return;
            }
            
            if (file.size > 50 * 1024 * 1024) { // 50MB limit
                showToast('حجم الفيديو كبير جداً (الحد الأقصى 50MB)', 'error');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedVideo = {
                    file: file,
                    preview: e.target.result,
                    type: 'video'
                };
                updateMediaPreview();
            };
            reader.readAsDataURL(file);
            
            event.target.value = '';
        }

        // Handle audio upload
        function handleAudioUpload(event) {
            const file = event.target.files[0];
            
            if (!file) return;
            
            // Check if images or video already uploaded
            if (uploadedImages.length > 0 || uploadedVideo) {
                showToast('لا يمكن إضافة صوت مع صور أو فيديو', 'warning');
                event.target.value = '';
                return;
            }
            
            if (file.size > 20 * 1024 * 1024) { // 20MB limit
                showToast('حجم الملف الصوتي كبير جداً (الحد الأقصى 20MB)', 'error');
                event.target.value = '';
                return;
            }
            
            uploadedAudio = {
                file: file,
                type: 'audio'
            };
            updateMediaPreview();
            
            event.target.value = '';
        }

        // Update media preview
        function updateMediaPreview() {
            const container = document.getElementById('media-preview-container');
            container.innerHTML = '';
            
            // Show image previews
            uploadedImages.forEach((item, index) => {
                const previewItem = document.createElement('div');
                previewItem.className = 'media-preview-item';
                previewItem.innerHTML = `
                    <img src="${item.preview}" alt="Preview ${index + 1}">
                    <button class="media-preview-remove" onclick="removeMedia('image', ${index})">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                container.appendChild(previewItem);
            });
            
            // Show video preview
            if (uploadedVideo) {
                const previewItem = document.createElement('div');
                previewItem.className = 'media-preview-item';
                previewItem.innerHTML = `
                    <video src="${uploadedVideo.preview}"></video>
                    <button class="media-preview-remove" onclick="removeMedia('video', 0)">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                container.appendChild(previewItem);
            }
            
            // Show audio preview
            if (uploadedAudio) {
                const previewItem = document.createElement('div');
                previewItem.className = 'media-preview-item';
                previewItem.innerHTML = `
                    <div class="audio-preview">
                        <i class="fas fa-music"></i>
                    </div>
                    <button class="media-preview-remove" onclick="removeMedia('audio', 0)">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                container.appendChild(previewItem);
            }
        }

        // Remove media
        function removeMedia(type, index) {
            if (type === 'image') {
                uploadedImages.splice(index, 1);
            } else if (type === 'video') {
                uploadedVideo = null;
            } else if (type === 'audio') {
                uploadedAudio = null;
            }
            updateMediaPreview();
        }

        // Switch tabs
        function switchTab(tab) {
            if (isLoading) return;

            currentTab = tab;

            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById(tab + '-tab');
            if (btn) {
                btn.classList.add('active');
            }

            // Load posts for the selected tab
            loadPosts();
        }

        // Get filter value for server
        function getFilterValue(tab) {
            // Convert frontend tab names to server filter names
            if (tab === 'my') {
                return 'my_posts';
            } else if (tab === 'liked') {
                return 'liked';
            }
            return 'all';
        }

        function getSessionUserId() {
            const n = parseInt(document.body.getAttribute('data-user-id') || '0', 10);
            return n > 0 && !isNaN(n) ? n : 0;
        }

        /** توحيد شكل المنشور بين /api/mobile/community/posts و /community_bonus/get_posts */
        function normalizePostsFromApi(rawList) {
            if (!Array.isArray(rawList)) return [];
            return rawList.map((p) => {
                const views = p.views_count != null ? p.views_count : (p.views != null ? p.views : 0);
                const liked = !!(p.is_liked || p.liked_by_me || p.user_liked);
                
                // Parse media arrays if they're strings
                let mediaFileIds = p.media_file_ids;
                let mediaTypes = p.media_types;
                let mediaPreviewUrls = p.media_preview_urls;
                
                if (typeof mediaFileIds === 'string') {
                    try { mediaFileIds = JSON.parse(mediaFileIds); } catch (e) { mediaFileIds = []; }
                }
                if (typeof mediaTypes === 'string') {
                    try { mediaTypes = JSON.parse(mediaTypes); } catch (e) { mediaTypes = []; }
                }
                if (typeof mediaPreviewUrls === 'string') {
                    try { mediaPreviewUrls = JSON.parse(mediaPreviewUrls); } catch (e) { mediaPreviewUrls = []; }
                }
                
                return {
                    ...p,
                    is_liked: liked,
                    liked_by_me: liked,
                    views_count: views,
                    likes_count: p.likes_count != null ? p.likes_count : (p.likes != null ? p.likes : 0),
                    comments_count: p.comments_count != null ? p.comments_count : 0,
                    media_file_ids: mediaFileIds || [],
                    media_types: mediaTypes || [],
                    media_preview_urls: mediaPreviewUrls || []
                };
            });
        }

        function mediaProxyUrl(fileId, mediaType) {
            const type = ['image', 'photo', 'video', 'audio', 'voice'].includes(String(mediaType || '').toLowerCase())
                ? String(mediaType).toLowerCase()
                : 'image';
            return `/api/mobile/media/proxy/${encodeURIComponent(String(fileId))}?media_type=${encodeURIComponent(type)}&v=2`;
        }

        function postMediaHtml(post) {
            const previewUrls = Array.isArray(post.media_preview_urls) ? post.media_preview_urls : [];
            const mediaTypes  = Array.isArray(post.media_types) ? post.media_types : [];
            const fileIds     = Array.isArray(post.media_file_ids) ? post.media_file_ids : [];

            // If previewUrls has elements, use previewUrls as primary list, otherwise fileIds
            const list = previewUrls.length > 0 ? previewUrls : fileIds.filter(f => f && f !== '__audio__');

            const media = list.map((item, index) => {
                const type = String(mediaTypes[index] || 'image').toLowerCase();
                let url = previewUrls[index] || (fileIds[index] ? mediaProxyUrl(fileIds[index], type) : item);
                if (typeof url === 'string') {
                    url = url.replace('https://www.stock-flow.site', '')
                             .replace('http://www.stock-flow.site', '')
                             .replace('https://bonuspharma1.pythonanywhere.com', '')
                             .replace('http://bonuspharma1.pythonanywhere.com', '');
                }
                if (type === 'video') {
                    return `<div class="post-media-mobile"><video controls playsinline preload="metadata" src="${url}">متصفحك لا يدعم تشغيل الفيديو.</video></div>`;
                }
                return `<div class="post-media-mobile"><img src="${url}" alt="مرفق المنشور" loading="lazy" onerror="this.parentElement.style.display='none'" /></div>`;
            }).join('');

            let audioUrl = post.audio_url || (post.audio_file_id ? mediaProxyUrl(post.audio_file_id, 'audio') : '');
            if (typeof audioUrl === 'string') {
                audioUrl = audioUrl.replace('https://www.stock-flow.site', '')
                                   .replace('http://www.stock-flow.site', '')
                                   .replace('https://bonuspharma1.pythonanywhere.com', '')
                                   .replace('http://bonuspharma1.pythonanywhere.com', '');
            }
            const audio = audioUrl
                ? `<div class="post-audio-mobile"><audio controls preload="metadata" src="${audioUrl}">متصفحك لا يدعم تشغيل الصوت.</audio></div>`
                : '';
            return `<div class="post-media-container">${media}${audio}</div>`;
        }

        async function fetchPostsJson(url) {
            /* بدون redirect: 'manual' — إعادة التوجيه 301/308 (مثل مسار بشرطة مائلة) تُتبَع تلقائياً؛ وإلا كان الطلب يفشل برقم 308 */
            const response = await fetch(url, {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Accept': 'application/json, text/javascript, */*;q=0.01',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            const ct = (response.headers.get('content-type') || '').toLowerCase();
            if (ct.indexOf('application/json') === -1) {
                throw new Error('الخادم لم يرجع JSON — غالباً انتهت الجلسة أو تمت إعادة توجيه لصفحة HTML. سجّل الدخول ثم افتح المجتمع من لوحة التحكم.');
            }
            let data;
            try {
                data = await response.json();
            } catch (e) {
                throw new Error('تعذر قراءة الاستجابة من الخادم.');
            }
            if (!response.ok) {
                throw new Error((data && (data.error || data.message)) || ('خطأ الخادم (' + response.status + ')'));
            }
            return data;
        }

        function parsePostsPayload(data) {
            if (data == null) return null;
            if (Array.isArray(data)) {
                return normalizePostsFromApi(data);
            }
            if (typeof data === 'object' && Object.prototype.hasOwnProperty.call(data, 'posts')) {
                return normalizePostsFromApi(data.posts || []);
            }
            if (data.success && data.posts !== undefined) {
                return normalizePostsFromApi(data.posts || []);
            }
            return null;
        }

        // Load posts
        async function loadPosts(isBackground = false) {
            if (isLoading) return;
            if (isBackground && isMediaPlaying()) return;

            isLoading = true;
            if (!isBackground && (!posts || posts.length === 0)) {
                showLoadingState();
            }

            try {
                const filterValue = getFilterValue(currentTab);
                const myUid = getSessionUserId();
                let list = null;
                let usedLegacy = false;

                const legacyEndpoint = window.location.hostname === 'localhost' && window.location.port === '8080'
                    ? 'http://127.0.0.1:5000/community_bonus/get_posts_test'
                    : `/community_bonus/get_posts?filter=${encodeURIComponent(filterValue)}`;

                const legacySep = legacyEndpoint.indexOf('?') >= 0 ? '&' : '?';

                // 1) مسار الموقع أولاً (نفس الجلسة والصفحة)
                try {
                    const dataLegacy = await fetchPostsJson(`${legacyEndpoint}${legacySep}t=${Date.now()}`);
                    const parsed = parsePostsPayload(dataLegacy);
                    if (parsed !== null) {
                        usedLegacy = true;
                        list = parsed;
                    }
                } catch (e) {
                    console.warn('[community] get_posts:', e);
                }

                // 2) احتياطي: API الموبايل (فقط إذا فشل المسار الأول أو لم يُفهم الرد)
                if (!usedLegacy) {
                    try {
                        const mobileData = await fetchPostsJson(`/api/mobile/community/posts?t=${Date.now()}`);
                        if (Array.isArray(mobileData)) {
                            list = normalizePostsFromApi(mobileData);
                        } else {
                            list = [];
                        }
                    } catch (e) {
                        console.warn('[community] mobile posts:', e);
                        if (!isBackground) {
                            throw new Error('تعذر تحميل المنشورات. سجّل الدخول كشركة ثم حدّث الصفحة.');
                        }
                        return;
                    }
                }

                if (list === null) {
                    list = [];
                }

                if (currentTab === 'my' && myUid > 0 && list.length) {
                    list = list.filter((p) => p.is_mine === true || Number(p.company_id) === myUid);
                }

                posts = list;
                renderPosts();

            } catch (error) {
                console.error('Error loading posts:', error);
                if (!isBackground && (!posts || posts.length === 0)) {
                    showErrorState(error.message || 'حدث خطأ غير متوقع');
                }
            } finally {
                isLoading = false;
            }
        }

        // Render posts (Smart DOM Update: preserves playing videos, audio, and media elements during background refresh)
        function renderPosts() {
            const listContainer = document.getElementById('posts-list');
            if (!listContainer) return;

            if (posts.length === 0) {
                const existingCards = listContainer.querySelectorAll('.post-card-mobile');
                if (existingCards.length === 0) {
                    const hint = document.getElementById('empty-state-hint');
                    if (hint) {
                        hint.textContent = currentTab === 'my'
                            ? 'في تبويب «منشوراتي» تظهر منشوراتك فقط. جرّب تبويب «العامة» لرؤية كل المنشورات.'
                            : 'كن أول من يشارك في مجتمع بونص فارما!';
                    }
                    showEmptyState();
                }
                return;
            }

            hideLoadingState();
            hideErrorState();
            hideEmptyState();

            const existingCards = listContainer.querySelectorAll('.post-card-mobile');
            if (existingCards.length === 0) {
                listContainer.innerHTML = posts.map(post => createPostHTML(post)).join('');
            } else {
                const newPostIds = new Set(posts.map(p => p.id));

                // 1. Remove deleted posts
                existingCards.forEach(el => {
                    const pid = parseInt(el.id.replace('post-', ''), 10);
                    if (!newPostIds.has(pid)) {
                        el.remove();
                    }
                });

                // 2. Smart update existing, or insert new
                posts.forEach((post, index) => {
                    const postEl = document.getElementById(`post-${post.id}`);
                    if (postEl) {
                        // Update counts and text without touching video/audio/media DOM
                        const likeCountEl = postEl.querySelector(`#like-count-${post.id}`);
                        if (likeCountEl && likeCountEl.textContent != post.likes_count) {
                            likeCountEl.textContent = post.likes_count;
                        }

                        const commentCountEl = postEl.querySelector(`#comment-count-${post.id}`);
                        if (commentCountEl && commentCountEl.textContent != post.comments_count) {
                            commentCountEl.textContent = post.comments_count;
                        }

                        // Update latest comment preview if changed
                        const oldPreview = postEl.querySelector('.latest-comment-preview');
                        const newPreviewHtml = latestCommentHtml(post);
                        if (oldPreview) {
                            if (newPreviewHtml) {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = newPreviewHtml;
                                oldPreview.replaceWith(tempDiv.firstElementChild);
                            } else {
                                oldPreview.remove();
                            }
                        } else if (newPreviewHtml) {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = newPreviewHtml;
                            postEl.appendChild(tempDiv.firstElementChild);
                        }
                    } else {
                        // Insert new post card at proper position
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = createPostHTML(post);
                        const newEl = tempDiv.firstElementChild;
                        const nextPost = posts[index + 1];
                        const nextEl = nextPost ? document.getElementById(`post-${nextPost.id}`) : null;
                        if (nextEl) {
                            listContainer.insertBefore(newEl, nextEl);
                        } else {
                            listContainer.appendChild(newEl);
                        }
                    }
                });
            }

            // Record views for visible posts
            setTimeout(() => {
                posts.forEach(post => {
                    if (isElementInViewport(document.getElementById(`post-${post.id}`))) {
                        recordView(post.id);
                    }
                });
            }, 1000);
        }

        // Create post
        async function createPost() {
            const content = document.getElementById('post-content').value.trim();

            if (!content && uploadedImages.length === 0 && !uploadedVideo && !uploadedAudio) {
                showToast('يرجى كتابة محتوى أو إضافة ملف', 'warning');
                return;
            }

            if (content.length > 500) {
                showToast('المنشور طويل جداً (الحد الأقصى 500 حرف)', 'error');
                return;
            }

            const submitBtn = document.getElementById('submit-post-btn');
            const originalHTML = submitBtn.innerHTML;

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            submitBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('content', content);
                formData.append('is_anonymous', isAnonymous);

                // Add images
                if (uploadedImages.length > 0) {
                    uploadedImages.forEach((item, index) => {
                        formData.append('images', item.file);
                    });
                }

                // Add video
                if (uploadedVideo) {
                    formData.append('video', uploadedVideo.file);
                }

                // Add audio
                if (uploadedAudio) {
                    formData.append('audio', uploadedAudio.file);
                }

                // Use test endpoint for localhost demo
                const endpoint = window.location.host === 'localhost:8080'
                    ? 'http://127.0.0.1:5000/community_bonus/create_post_test'
                    : '/community_bonus/create_post';

                const response = await fetch(endpoint, {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                let data = null;
                try {
                    data = await response.json();
                } catch (_) {}

                if (response.ok && data && data.success) {
                    // Clear form
                    document.getElementById('post-content').value = '';
                    isAnonymous = false;
                    document.getElementById('anonymous-toggle').classList.remove('active');
                    
                    // Clear media
                    uploadedImages = [];
                    uploadedVideo = null;
                    uploadedAudio = null;
                    updateMediaPreview();
                    
                    updateCharacterCounter();

                    // Close modal and reload
                    closeCreatePostModal();
                    loadPosts();

                    showToast('تم نشر المنشور بنجاح!', 'success');
                } else {
                    const msg = (data && (data.error || data.message)) || `HTTP ${response.status}`;
                    showToast(msg || 'حدث خطأ في نشر المنشور', 'error');
                    return;
                }

            } catch (error) {
                console.error('Error creating post:', error);
                showToast('حدث خطأ في نشر المنشور', 'error');
            } finally {
                submitBtn.innerHTML = originalHTML;
                submitBtn.disabled = false;
            }
        }

        // Toggle like (إضافة وإلغاء الإعجاب)
        async function toggleLike(postId) {
            const likeBtn = document.querySelector(`#post-${postId} .action-btn-mobile`);

            try {
                const response = await fetch('/community_bonus/toggle_like', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ post_id: postId })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    // Update UI بناءً على الحالة الجديدة للإعجاب
                    const btn = document.querySelector(`#like-btn-${postId}`) || likeBtn;
                    if (!btn) return;

                    if (data.liked) {
                        btn.classList.add('liked');
                        btn.innerHTML = '<i class="fas fa-heart"></i> <span id="like-count-' + postId + '">' + data.likes_count + '</span>';
                        
                        // Save to local storage
                        const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');
                        if (!likedPosts.includes(postId)) {
                            likedPosts.push(postId);
                            localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
                        }
                        
                        // Send notification to post owner
                        notifyPostOwner(postId, 'like');
                    } else {
                        btn.classList.remove('liked');
                        btn.innerHTML = '<i class="far fa-heart"></i> <span id="like-count-' + postId + '">' + data.likes_count + '</span>';
                        
                        // Remove from local storage
                        let likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');
                        likedPosts = likedPosts.filter(id => id !== postId);
                        localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
                    }

                } else {
                    throw new Error(data.error || 'Unknown error');
                }

            } catch (error) {
                console.error('Error toggling like:', error);
                showToast('حدث خطأ في تبديل الإعجاب', 'error');
            }
        }

        // Render comments

            const commentsList = document.getElementById(`comments-list-${postId}`);

                commentsList.innerHTML = '<p style="text-align: center; color: #6c757d; font-size: 0.8rem;">لا توجد تعليقات بعد</p>';

            commentsList.innerHTML = comments.map(comment => {
                const isOwner = comment.can_delete === true || (currentUserId > 0 && comment.company_id === currentUserId);
                const canEdit = comment.can_edit === true || (currentUserId > 0 && comment.company_id === currentUserId);

                return `

        // Add comment
        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const content = input.value.trim();
            const isAnonymous = document.getElementById(`anon-comment-${postId}`)?.checked || false;

            if (!content) {
                showToast('يرجى كتابة تعليق', 'warning');
                return;
            }

            try {
                const response = await fetch('/community_bonus/add_comment', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        post_id: postId,
                        content: content,
                        is_anonymous: isAnonymous
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    input.value = '';
                    const toggle = document.getElementById(`anon-comment-${postId}`);
                    if(toggle) toggle.checked = false;
                    
                    // Save comment ID if available (assuming data.comment_id or similar)
                    if (data.comment_id) {
                        const myComments = JSON.parse(localStorage.getItem('myComments') || '[]');
                        if (!myComments.includes(data.comment_id)) {
                            myComments.push(data.comment_id);
                            localStorage.setItem('myComments', JSON.stringify(myComments));
                        }
                    }

                    loadComments(postId);

                    // Update comment count
                    const commentCount = document.getElementById(`comment-count-${postId}`);
                    if (commentCount) {
                        commentCount.textContent = data.comments_count;
                    }

                    showToast('تم إضافة التعليق بنجاح', 'success');
                    
                    // Notify post owner
                    notifyPostOwner(postId, 'comment');
                } else {
                    throw new Error(data.error || 'Unknown error');
                }

            } catch (error) {
                console.error('Error adding comment:', error);
                showToast('حدث خطأ في إضافة التعليق', 'error');
            }
        }
